services:
  db:
    image: postgres:15
    container_name: crm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: riya@123
      POSTGRES_DB: crm_hcp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:riya%40123@db:5432/crm_hcp
      - GROQ_API_KEY=${GROQ_API_KEY}
      - APP_NAME=CRM HCP Module
      - DEBUG=True
      - ALLOWED_ORIGINS=["http://localhost:5173"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - crm_network
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

networks:
  crm_network:
    driver: bridge

volumes:
  postgres_data:
  frontend_node_modules: